name: ci-cd

# run on pull requests and pushes
on: [pull_request, push]

jobs:
  # test the application with pytest and report coverage
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run pytest with coverage
        run: |
          pytest --cov=main --cov=ml_utils --cov-report=term-missing --cov-fail-under=90

  # zip the codebase and upload it as an artifact when the build succeeds
  upload_zip:
    runs-on: ubuntu-latest
    needs: build
    # only for pushes
    if: ${{ github.event_name == 'push' }}
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v4
      - name: Zip the code
        run: |
          zip -r release.zip . -x ".git/*" ".github/*" ".gitignore"
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-release
          path: release.zip
